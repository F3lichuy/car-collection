# Mercado MX · ingesta diaria de las fuentes web (gratis en un repo público).
# Corre solo las fuentes con enabled: true en mercado/sources.yaml.
# Secret necesario (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL  = cadena de conexión del pooler de Supabase (con contraseña)
# Nota: GitHub solo ejecuta el cron desde la rama principal (main).
name: Mercado MX · ingesta

on:
  schedule:
    - cron: '17 12 * * *'        # 06:17 en CDMX
  workflow_dispatch:
    inputs:
      fuente:
        description: 'Fuentes separadas por coma (vacío = todas las activas)'
        required: false
      limite:
        description: 'Máximo de anuncios por fuente (vacío = sin límite)'
        required: false
      solo_barrido:
        description: 'Solo buscar repetidos entre lo ya guardado (no visita fuentes)'
        type: boolean
        default: false
      seco:
        description: 'En seco: base temporal, no toca Supabase (para probar una fuente nueva)'
        type: boolean
        default: false

concurrency:
  group: mercado-ingesta
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mercado
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mercado/package-lock.json
      - run: npm ci
      - name: Pruebas (si fallan, no se toca la base)
        run: npm test
      # Avance de Wayback (qué copias ya se leyeron): se guarda entre corridas en la caché de Actions
      - uses: actions/cache/restore@v4
        with:
          path: mercado/.capturas/wayback-estado.json
          key: wayback-estado-${{ github.run_id }}
          restore-keys: wayback-estado-
      - name: Ingesta
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FUENTE: ${{ inputs.fuente }}
          LIMITE: ${{ inputs.limite }}
          SOLO_BARRIDO: ${{ inputs.solo_barrido }}
          SECO: ${{ inputs.seco }}
        run: |
          ARGS=(--reporte reporte.json)
          if [[ "$SECO" == "true" ]]; then ARGS+=(--seco); export WAYBACK_ESTADO="$RUNNER_TEMP/wayback-prueba.json"; fi
          if [[ "$SOLO_BARRIDO" == "true" ]]; then ARGS+=(--solo-barrido); fi
          if [[ "$FUENTE" =~ ^[a-z0-9,-]+$ ]]; then ARGS+=(--fuente "$FUENTE"); fi
          if [[ "$LIMITE" =~ ^[0-9]+$ ]]; then ARGS+=(--limite "$LIMITE"); fi
          node scripts/ingest.mjs "${ARGS[@]}"
      - uses: actions/cache/save@v4
        if: always() && inputs.seco != true && hashFiles('mercado/.capturas/wayback-estado.json') != ''
        with:
          path: mercado/.capturas/wayback-estado.json
          key: wayback-estado-${{ github.run_id }}
      - name: Resumen
        if: always()
        run: node scripts/report-md.mjs reporte.json >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-${{ github.run_id }}
          path: mercado/reporte.json
          retention-days: 30
          if-no-files-found: ignore
