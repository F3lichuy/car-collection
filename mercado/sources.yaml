  - id: luxury-in-motion
    name: Luxury in Motion
    kind: broker
    cities: [CDMX, Guadalajara]
    base_url: https://www.luxuryinmotionmx.com
    adapter: ficha
    config:
      # Wix: un sitemap por sección (deportivos, clásicos, de lujo, SUVs…); el mismo auto puede estar en dos
      sitemaps: [/sitemap.xml]
      sitemap_index: true
      # (sin "más recientes" ni "más populares": son los mismos autos de las otras secciones)
      include: "luxuryinmotionmx[.]com/(deportivos|clasicos|de-lujo|delujo|suvs|blindados|otros|pickups)[^/]*/[^/]+$"
      currency: MXN               # la ficha dice "$2,100,000" (911 Carrera 1975): pesos, verificado a mano
      # el <h1> es el letrero de la sección; el auto va después de "VOLVER A LOS CLÁSICOS": "PORSCHE 911 Carrera 1975 $2,100,000"
      title_re: "VOLVER A[^$]*?(?:CL[ÁA]SICOS|DEPORTIVOS|DE LUJO|SUVS|BLINDADOS|OTROS|PICKUPS)\\s+([^$]+?)\\s*\\$"
      photos: og                  # las demás imágenes de la página son del diseño
      open_all: true              # el slug no trae la marca; sitio chico
      city: null                  # Guadalajara, CDMX y Morelia; la ficha no dice cuál
    capture_mode: scraper
    data: "Wix: ficha con título y precio en el HTML ('PORSCHE 911 Carrera 1975 $2,100,000'), sin km. ~30 autos (deportivos, clásicos, SUVs, blindados)"
    enabled: true

