    verify: "Su contenido indexado es viejo; confirmar que siga activo"
    enabled: false

  - id: motorstalgia-mty
    name: Motorstalgia Monterrey
    kind: broker
    cities: [Monterrey]
    base_url: https://vehiculos.mercadolibre.com.mx/_CustId_3163409841
    capture_mode: script_local
    data: "Vende en Mercado Libre (vendedor 3163409841). Su robots.txt prohíbe leer páginas de vendedor: solo por la API oficial con tu app (scripts/ml-vendedor.mjs)"
    enabled: false

  - id: cars-and-more-mty
    name: Cars and More
    kind: broker
    cities: [Monterrey]
    capture_mode: manual
