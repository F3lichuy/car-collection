      include: "/vehiculo/"
      content_end: "Valoraciones|te recomendamos|Productos relacionados"   # después vienen otros autos
    capture_mode: scraper
    data: "Sitemap de productos + JSON-LD Product/Offer en cada ficha (precio y moneda MXN declarados)"
