    base_url: https://automotoresdelbajio.com.mx/autos/premium
    capture_mode: scraper
    enabled: false

  - id: montecarlo-autos-de-lujo
    name: Montecarlo Autos de Lujo
    kind: broker
    cities: [Querétaro]
    base_url: https://montecarlo.mx
    adapter: stm-listings
    config:
      currency: MXN      # la ficha dice "MXN 638,000"
    capture_mode: scraper
    data: "Tema Motors: API REST /wp-json/wp/v2/listings (103 autos; car_meta con precio, km y VIN; bandera 'vendido')"
    verify: "Mucho premium alemán general: filtrar solo modelos de la taxonomía"
    enabled: false

  - id: imperia-motors
    name: Imperia Motors
    kind: broker
    cities: []
    base_url: https://imperiamotors.mx
    adapter: ficha
    config:
      sitemaps: [/wp-sitemap-posts-autos-1.xml]
      include: "/autos/[^/]+/?$"
      content_end: "También podría interesarte"
    capture_mode: scraper
    data: "Sitemap de autos + etiquetas de la ficha (Marca, Año, Kilometraje, Transmisión); precio '$ 950,000 MXN'"
