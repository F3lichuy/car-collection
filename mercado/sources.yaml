# ════════════════════════════════════════════════════════════════════════
# Mercado MX · Catálogo de fuentes
#
# enabled: false en todas hasta que las apruebes. Investigadas el 2026-11-10
# (búsqueda web + revisión técnica de cada sitio: respuesta, robots.txt,
# sitemap y datos estructurados).
#
# capture_mode
#   scraper       HTTP simple (GitHub Actions, diario)
#   playwright    necesita navegador real (el sitio rechaza lectores simples)
#   script_local  corre en tu computadora con tu sesión (Facebook)
#   manual        sin inventario web: Instagram / WhatsApp / Facebook → captura rápida
# data: dónde están los datos del auto en el sitio (lo que usará el adaptador)
# verify: lo que falta confirmar antes de activarla
# ════════════════════════════════════════════════════════════════════════

defaults:
  user_agent: "MercadoMX/0.1 (+https://carcollection.app; contacto por el sitio)"
  min_delay_seconds: 3        # 1 petición cada 3 s como mínimo
  max_pages_per_run: 40
  retries: 3

sources:

  # ── Programas oficiales de seminuevos certificados ──────────────────────
  - id: porsche-approved-mx
    name: Porsche Approved México (todos los Porsche Centre)
    kind: agencia_oficial
    cities: [CDMX, Monterrey, Guadalajara, Puebla, Querétaro, León, Cancún, Mérida, Tijuana]
    base_url: https://finder.porsche.com/mx/es-MX
    capture_mode: playwright
    data: "Buscador oficial; responde 429 a lectores simples"
    verify: "Probar con navegador real a baja frecuencia; buscar API interna del finder"
    enabled: false

  - id: ferrari-approved-mx
    name: Ferrari Approved (Ferrari Mexico City)
    kind: agencia_oficial
    cities: [CDMX]
    base_url: https://preowned.ferrari.com/es-MX/r/latin-america/used-ferrari/mexico
    capture_mode: playwright
    data: "Fichas con VIN en la URL; responde 405 a lectores simples"
    verify: "Probar con navegador real"
    enabled: false

  - id: lamborghini-selezione-mx
    name: Lamborghini Selezione (CDMX y Monterrey)
    kind: agencia_oficial
    cities: [CDMX, Monterrey]
    base_url: https://www.lamborghini.com/es-en
    capture_mode: scraper
    data: "Sitio Next.js (__NEXT_DATA__)"
    verify: "Ubicar el localizador de seminuevos y si lista inventario de México"
    enabled: false

  - id: mclaren-qualified
    name: McLaren Qualified
    kind: agencia_oficial
    cities: []
    base_url: https://preowned.mclaren.com
    capture_mode: scraper
    verify: "No encontré un retailer McLaren en México con inventario publicado"
    enabled: false

  - id: bentley-polanco
    name: Bentley Polanco
    kind: agencia_oficial
    cities: [CDMX]
    base_url: https://www.bentleymotors.com/en/apps/locate.bentley-polanco.retailer-3262.html
    capture_mode: playwright
    data: "Responde 403 a lectores simples"
    verify: "Confirmar si publica seminuevos en el localizador de Bentley"
    enabled: false

  - id: rolls-royce-provenance
    name: Rolls-Royce Provenance (pre-owned)
    kind: agencia_oficial
    cities: []
    base_url: https://www.rolls-roycemotorcars.com
    capture_mode: playwright
    verify: "Confirmar si hay distribuidor en México con inventario en el localizador"
    enabled: false

  - id: aston-martin-timeless
    name: Aston Martin Timeless (pre-owned)
    kind: agencia_oficial
    cities: []
    base_url: https://www.astonmartin.com
    capture_mode: playwright
    verify: "Confirmar distribuidor en México con inventario publicado"
    enabled: false

  - id: mercedes-certified-mx
    name: Mercedes-Benz seminuevos certificados (AMG)
    kind: agencia_oficial
    cities: []
    base_url: https://www.mercedes-benz.com.mx
    capture_mode: scraper
    verify: "Ubicar el buscador de seminuevos certificados; filtrar solo AMG de la taxonomía"
    enabled: false

  # ── Portales (concentran muchas agencias a la vez) ──────────────────────
  - id: seminuevos-com
    name: Seminuevos.com
    adapter: seminuevos
    min_delay_seconds: 5      # el sitio responde lento (3-7 s) y corta conexiones si se le apura
    kind: portal
    cities: [nacional]
    base_url: https://www.seminuevos.com
    capture_mode: scraper
    data: "JSON-LD schema.org ItemList de Vehicle en el HTML (año, km, transmisión, color, precio, moneda, URL con id)"
    robots: "Permite /usados/-/autos/-/<marca>; prohíbe ?seller= ?transmission= ?fuel= ?rText="
    verify: "Paginación; ficha de detalle (vendedor, ciudad, fotos)"
    enabled: false

  - id: mercadolibre-autos
    name: Mercado Libre Autos (incluye tiendas de agencias e Iconic Broker)
    kind: portal
    cities: [nacional]
    base_url: https://autos.mercadolibre.com.mx
    capture_mode: scraper
    data: "API oficial requiere app de desarrollador (gratis, OAuth). El listado HTML trae JSON-LD Product (48 por página)"
    verify: "Preferir API con app gratuita que crees tú; respaldo HTML"
    enabled: false

  - id: kavak
    name: Kavak (solo marcas de la taxonomía)
    kind: portal
    cities: [nacional]
    base_url: https://www.kavak.com/mx/seminuevos
    capture_mode: scraper
    data: "Sitio Next.js con JSON-LD; 83 sitemaps"
    robots: "Crawl-delay: 20"
    min_delay_seconds: 20
    enabled: false

  - id: autocosmos
    name: Autocosmos (páginas de agencias, p. ej. Porsche Centre Mérida, San Ángel, Cancún)
    kind: portal
    cities: [nacional]
    base_url: https://www.autocosmos.com.mx
    capture_mode: scraper
    robots: "Crawl-delay: 20; prohíbe /search"
    min_delay_seconds: 20
    enabled: false

  - id: autoclasico
    name: AutoClasico.com.mx (portal de clásicos)
    kind: portal
    cities: [nacional]
    base_url: https://www.autoclasico.com.mx/site/
    capture_mode: playwright
    data: "Reto de Cloudflare a lectores simples"
    enabled: false

  - id: facebook-marketplace
    name: Facebook Marketplace
    kind: marketplace
    cities: [Monterrey, CDMX, Guadalajara, Querétaro, Puebla, León, San Luis Potosí, Cancún, Tijuana]
    base_url: https://www.facebook.com/marketplace
    capture_mode: script_local
    data: "Script Playwright en tu computadora con tu sesión + bookmarklet de respaldo"
    enabled: false

  # ── Subastas (ventas reales, no solo precio pedido) ─────────────────────
  - id: morton-subastas
    name: Morton Subastas · Autos y Camiones (clásicos y colección)
    kind: subasta
    cities: [CDMX]
    base_url: https://mortonautosycamiones.com
    capture_mode: scraper
    data: "Catálogos de subasta; buscar resultados (precio de martillo) → transacciones"
    verify: "Si publica precios de venta, entran como ventas confirmadas con confianza media"
    enabled: false

  # ── Brokers y agencias · CDMX y área metropolitana ──────────────────────
  - id: exotic-avenue
    name: Exotic Avenue
    kind: broker
    cities: [CDMX]
    base_url: https://exoticavenue.mx
    adapter: ficha
    config:
      list_pages: [/nuestros-autos]
      include: "^/nuestros-autos/9-autos-exoticos/\\d+-"   # "uncategorised" trae autos de pista (Huracán Super Trofeo)
      content_end: "Acerca del Auto"
      labels: { year: [modelo, año], model: [] }
      photo_path: "^/images/yootheme/autos/"
      sold: "Precio\\s+VENDIDO"          # los vendidos siguen publicados con "Precio: VENDIDO"
    capture_mode: scraper
    data: "Joomla: lista en /nuestros-autos + etiquetas de la ficha (Transmisión, Kilometraje, Color); precio '$1,450,000.00 MXN'. Ojo: su etiqueta 'Modelo:' es el año"
    enabled: false

  - id: jah-motors
    name: JAH Motors
    adapter: woocommerce
    kind: broker
    cities: [Monterrey]          # sus categorías de tienda son "jahmotors-monterrey", "auto-monterrey"
    base_url: https://jahmotors.com
    capture_mode: scraper
    data: "WooCommerce Store API pública (moneda MXN declarada). No publica precios (precio 0 → sin precio)"
    notes: "Posiblemente el 'JA Motors' que mencionaste — confirmar"
    enabled: false

  - id: autos-consigna
    name: Autos Consigna
    kind: broker
    cities: [CDMX]
    base_url: https://autosconsigna.pro
    capture_mode: playwright
    data: "Responde 456 (bloqueo) a lectores simples"
    enabled: false

  - id: luxury-in-motion
    name: Luxury in Motion
    kind: broker
    cities: [CDMX, Guadalajara]
    base_url: https://www.luxuryinmotionmx.com
    capture_mode: scraper
    data: "Wix con JSON-LD"
    enabled: false

  - id: mulsanne
    name: Mulsanne Venta de Autos (Santa Fe)
    kind: broker
    cities: [CDMX]
    base_url: https://mulsanne.com.mx
    adapter: ficha
    config:
      sitemaps: [/wp-sitemap-posts-pixad-autos-1.xml]
      include: "/autos/[^/]+/?$"
      content_end: "Ubicación del vendedor"
      currency: MXN      # la ficha muestra "$395,000" sin moneda; por magnitud son pesos (BMW 325i convertible 1988 = $395,000)
    capture_mode: scraper
    data: "Sitemap de autos (tema Pixad) + etiquetas de la ficha (Make, Model, Made Year, Kilometraje, Transmisión, Color)"
    verify: "El sitio no marca vendidos: su lista /cars/ y el sitemap traen los mismos ~103. Se toma lo publicado como en venta"
    enabled: false

  - id: rich-wonders
    name: Rich Wonders
    kind: broker
    cities: [CDMX]
    base_url: https://richwonders.com
    capture_mode: scraper
    data: "WooCommerce Store API (13 autos, mezcla yates y relojes)"
    verify: "TODO: la tienda declara USD, pero un F430 2007 a 290,500 USD no cuadra ni en USD ni en MXN; descripciones de relleno. No se carga hasta confirmar la moneda"
    enabled: false

  - id: euroclassic-import
    name: EuroClassic Import (clásicos europeos, Porsche refrigerados)
    adapter: shopify
    config:
      collection: autos-disponibles-en-mexico   # solo autos ya en México (no precios de otros mercados)
    kind: broker
    cities: [CDMX]
    base_url: https://euroclassic-import.com
    capture_mode: scraper
    data: "Shopify: /products.json estructurado"
    enabled: false

  - id: netmotors-garage
    name: NetMotors Garage (clásicos)
    kind: broker
    cities: [CDMX]
    base_url: https://netmotorsgarage.com
    adapter: vehica
    config:
      rest_base: cars
      currency: MXN      # la ficha muestra "$638,000" sin moneda; agencia de CDMX, precios en pesos por magnitud (F-100 1971 = $638,000)
      fields: { year: vehica_14696, version: vehica_23407, km: vehica_6664, color: vehica_23408, price: vehica_6656, gallery: vehica_6673 }
    capture_mode: scraper
    data: "Tema Vehica: API REST /wp-json/wp/v2/cars (166 autos, la mayoría clásicos americanos fuera de la taxonomía)"
    enabled: false

  - id: parkmate-mx
    name: ParkMate MX
    kind: broker
    cities: [CDMX, Monterrey, Guadalajara, Puebla, Querétaro, Cancún]
    base_url: https://www.parkmatemx.com
    capture_mode: scraper
    data: "Wix con JSON-LD"
    verify: "Mezcla renta y venta: filtrar solo venta"
    enabled: false

