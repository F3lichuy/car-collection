  # ── Archivo histórico ───────────────────────────────────────────────────
  # Copias viejas de anuncios que los sitios ya borraron (adapters/wayback.mjs). Cada anuncio
  # se guarda con el source_id del sitio original y capture_method = 'wayback'; entra como
  # "ya no aparece" y con el precio del día de cada copia (varias copias = historial de precio).
  # Avance entre corridas: .capturas/wayback-estado.json (en GitHub Actions, en la caché).
  - id: wayback
    name: Wayback Machine (anuncios archivados en archive.org)
    adapter: wayback
    kind: portal
    cities: [nacional]
    base_url: https://web.archive.org
    capture_mode: scraper
    min_delay_seconds: 4       # archive.org pide no apurarlo
    data: "Índice CDX público (copias por dirección, filtradas por marca/modelo de la taxonomía) + la copia tal como se guardó (id_)"
    verify: "Correr una vez en seco: node scripts/ingest.mjs --seco --fuente wayback --limite 30"
    config:
      max_snapshots_per_run: 250    # ~20-30 min por corrida a 4 s por copia
      cdx_page: 3000
      rescan_days: 30               # al terminar un sitio, lo repasa cada mes (archive.org sigue guardando)
      targets:
        - id: mercadolibre
          source: mercadolibre-autos
          parser: mercadolibre
          prefixes: [auto.mercadolibre.com.mx/MLM-, articulo.mercadolibre.com.mx/MLM-, vehiculo.mercadolibre.com.mx/MLM-]
          id_re: "MLM-?(\\d{6,})"
          id_prefix: MLM
        - id: seminuevos
          source: seminuevos-com
          parser: jsonld          # solo copias con datos estructurados de vehículo
          prefixes: [www.seminuevos.com/, seminuevos.com/]
        - id: kavak
          source: kavak
          parser: jsonld
          prefixes: [www.kavak.com/mx/]
        - id: autocosmos
          source: autocosmos
          parser: jsonld
          prefixes: [www.autocosmos.com.mx/auto/usado/]
    enabled: false

