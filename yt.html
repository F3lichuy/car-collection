<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Car Collection · reproductor del anfitrión</title>
<style>
  html,body{margin:0;height:100%;background:#0c1712;color:#ece6d6;font:13px/1.4 system-ui,sans-serif}
  body{display:flex;flex-direction:column}
  .p{flex:1;min-height:0}
  iframe{width:100%;height:100%;border:0;display:block}
  .b{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;font-size:12px;color:#8e968a}
  a{color:#dda13a}
</style>
</head>
<body>
<div class="p" id="p"></div>
<div class="b"><span>Ventana del anfitrión · solo tú ves el video</span><a id="yt" target="_blank" rel="noopener noreferrer">Ver en YouTube ↗</a></div>
<script>
// reproductor oficial de YouTube (sin modificar), con el inicio y el fin del clip
const q=new URLSearchParams(location.search), v=(q.get("v")||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,11);
const s=Math.max(0,parseInt(q.get("s"),10)||0), e=Math.max(s+1,parseInt(q.get("e"),10)||s+12), a=q.get("a")==="1"?1:0;
if(v){
  const f=document.createElement("iframe");
  f.src=`https://www.youtube-nocookie.com/embed/${v}?start=${s}&end=${e}&autoplay=${a}&rel=0&playsinline=1`;
  f.allow="autoplay; encrypted-media; picture-in-picture"; f.title="Clip de YouTube"; f.allowFullscreen=true;
  document.getElementById("p").appendChild(f);
  document.getElementById("yt").href=`https://www.youtube.com/watch?v=${v}&t=${s}s`;
}
</script>
</body>
</html>
